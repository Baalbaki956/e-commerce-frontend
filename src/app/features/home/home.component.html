<div class="text-white flex flex-col justify-center items-center w-full h-full relative gap-[1.5rem]">
    <div class="w-[70%] h-auto m-[1rem]">
        <div class="bg-[#000606] w-full h-auto rounded-lg p-[2rem]">
            <h1 class="text-4xl">Summer Collection 2025</h1>
            <br>
            <p class="text-[#999]">Discover our latest collection of modern home decor and furniture pieces.</p>
            
            <button class="bg-[#40424a] text-white hover:text-[#07bdaf] px-[1rem] py-2 mt-8 rounded-full focus:outline-none hover:cursor-pointer flex gap-[1rem]">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M440-760v-160h80v160h-80Zm266 110-55-55 112-115 56 57-113 113Zm54 210v-80h160v80H760ZM440-40v-160h80v160h-80ZM254-652 140-763l57-56 113 113-56 54Zm508 512L651-255l54-54 114 110-57 59ZM40-440v-80h160v80H40Zm157 300-56-57 112-112 29 27 29 28-114 114Zm283-100q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 100-70 170t-170 70Zm0-80q66 0 113-47t47-113q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47Zm0-160Z"/></svg>

        </div>
    </div>

    <div class="w-[70%] h-auto m-[1rem] flex flex-col">
        <h1 class="text-2xl">Featured Categories</h1>
        <div class="w-full h-auto rounded-lg pt-[2rem] flex flex-row gap-[1.85rem]">
            <div *ngFor="let category of categories" class="flex flex-col content-center box-border transition-shadow hover:shadow-[0_0_10px_rgba(0,255,255,0.4)] duration-300 rounded-lg">
                <div [ngStyle]="{ 'background-color': category.bgColor }" class="transition-shadow bg-black w-[137px] flex flex-col justify-center items-center rounded-lg py-4 border-2 border-transparent hover:border-[#07bdaf]">
                    <img [src]="category.imageUrl" alt="{{ category.name }}" class="w-[84px] h-[84px] transition-transform duration-300 ease-in-out transform hover:scale-[1.05]" />
                        <div class="text-center">
                            <a href=""><h3 class="text-[16px] text-[#253D4E] font-[600] hover:text-[#07bdaf]">{{ category.name }}</h3>
                                <p class="text-[#7E7E7E] text-[14px]">{{ category.itemCount }} items</p>
                            </a>
                        </div>
                    
                </div>
            </div>
        </div>
    </div>

<div class="container mx-auto px-20 py-6 md:px-20 md:py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px"
                fill="currentColor">
                <path
                    d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z" />
            </svg>

            My Account
        </h1>
        <p>Manage your account and preferences</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm">
        <div class="w-full">
            <div style="outline: none;">
                <div class="bg-white rounded-lg shadow-sm p-4 m-full mx-auto ">
                    <div role="tablist" aria-label="Tabs example" class="flex border-b border-gray-200">
                        <button
                            (click)="selectTab('personal_info')" 
                            [class.border-b-2]="activeTab === 'personal_info'"
                            [class.border-purple-300]="activeTab === 'personal_info'"
                            class="cursor-pointer px-4 py-2 focus:outline-none">
                            Personal Info</button>
                        <button 
                            (click)="selectTab('orders')" 
                            [class.border-b-2]="activeTab === 'orders'"
                            [class.border-purple-300]="activeTab === 'orders'"
                            class="cursor-pointer px-4 py-2 focus:outline-none">Orders</button>
                        <button (click)="selectTab('wishlist')" [class.border-b-2]="activeTab === 'wishlist'"
                            [class.border-purple-300]="activeTab === 'wishlist'"
                            class="cursor-pointer px-4 py-2 focus:outline-none">Wishlist</button>
                        <button (click)="selectTab('security')" [class.border-b-2]="activeTab === 'security'"
                            [class.border-purple-300]="activeTab === 'security'"
                            class="cursor-pointer px-4 py-2 focus:outline-none">Security</button>
                    </div>

                    <div class="p-4">
                        <app-profile *ngIf="activeTab === 'personal_info'"></app-profile>
                        <app-orders *ngIf="activeTab === 'orders'"></app-orders>
                        <app-wishlist *ngIf="activeTab === 'wishlist'"></app-wishlist>
                        <app-security *ngIf="activeTab === 'security'"></app-security>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

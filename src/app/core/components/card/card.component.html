<!-- Fixed-size card (adjust w-80 and h-96 as needed) -->
<div class="w-80 h-96 rounded-xl overflow-hidden shadow-sm border border-gray-100 group hover:shadow-lg transition-all duration-300 ease-in-out hover:-translate-y-1 flex flex-col">
    <!-- Fixed-size image container (h-56 remains) -->
    <div class="w-full h-56 relative overflow-hidden flex-shrink-0"> <!-- flex-shrink-0 prevents resizing -->
        <!-- Image forced to cover the container -->
        <img 
            class="w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-70" 
            src="{{ imageURL }}" 
            alt="Sunset in the mountains"
        >
        <!-- Centered Icons (hidden by default) -->
        <div class="absolute inset-0 flex items-center justify-center gap-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <button class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition hover:scale-110">
                ❤️
            </button>
            <button class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition hover:scale-110">
                🔍
            </button>
        </div>
    </div>
    
    <!-- Card Content (flex-grow allows it to take remaining space) -->
    <div class="px-6 py-4 flex-grow">
        <div class="font-bold text-xl mb-2">{{ title }}</div>
        <p class="text-gray-700 text-base">
            {{ description }}
        </p>
    </div>
</div>

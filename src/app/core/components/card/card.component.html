<!-- Fixed-size card (adjust w-80 and h-96 as needed) -->
<div
    class="w-80 h-96 rounded-xl overflow-hidden shadow-sm border border-gray-100 group hover:shadow-lg transition-all duration-300 ease-in-out hover:-translate-y-1 flex flex-col">
    <!-- Fixed-size image container (h-56 remains) -->
    <div class="w-full aspect-[4/3] relative overflow-hidden flex-shrink-0"> <!-- flex-shrink-0 prevents resizing -->
        <!-- Image forced to cover the container -->
        <img class="w-full h-full object-cover transition-opacity duration-300 group-hover:opacity-70"
            src="{{ imageURL }}" alt="Sunset in the mountains">
        <!-- Centered Icons (hidden by default) -->
        <div
            class="absolute inset-0 flex items-center justify-center gap-4 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <button class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition hover:scale-110"
                *ngIf="!isWishlist">
                ❤️
            </button>
            <button class="p-2 bg-white scale-130 bg-opacity-80 rounded-full hover:bg-opacity-100 transition hover:scale-140 text-red-500" *ngIf="isWishlist">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-trash2 h-4 w-4" data-lov-id="src/pages/Cart.tsx:67:28" data-lov-name="Trash2"
                    data-component-path="src/pages/Cart.tsx" data-component-line="67" data-component-file="Cart.tsx"
                    data-component-name="Trash2" data-component-content="%7B%22className%22%3A%22h-4%20w-4%22%7D">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                    <line x1="10" x2="10" y1="11" y2="17"></line>
                    <line x1="14" x2="14" y1="11" y2="17"></line>
                </svg>
            </button>
            <button class="p-2 bg-white bg-opacity-80 rounded-full hover:bg-opacity-100 transition hover:scale-110">
                🔍
            </button>
        </div>
    </div>

    <!-- Card Content (flex-grow allows it to take remaining space) -->
    <div class="px-6 py-4 flex-grow">
        <div class="font-bold text-xl mb-2">{{ title }}</div>
        <p class="text-gray-700 text-base">
            {{ description }}
        </p>
    </div>
</div>

<aside class="fixed h-screen w-[270px] bg-[#1e2027] border-r border-[#2b2e36] text-white p-[1.5rem] items-center">
    <ul class="flex flex-col gap-[1rem]">
        <a 
            [routerLink]="item.route" 
            routerLinkActive="bg-[#000606] text-[#07bdaf] hover:bg-[#000606]" 
            [routerLinkActiveOptions]="{ exact: true }"
            *ngFor="let item of menuItems" 
            class="hover:bg-[#1b1c23] rounded-lg flex flex-row items-center py-[0.8rem] px-[1rem] gap-[1rem] hover:text-[#07bdaf] text-[.9em]"
        >

            <span [innerHTML]="item.icon"></span>
            <li class="block color-[#999999]">
                {{ item.label }}
            </li>
        </a>
    </ul>

    <div class="border border-[#2b2e36] border-lg rounded-lg gap-[1.5rem] mt-86">
        <ul class="flex flex-col"> <!-- Changed to flex-col for column layout -->
            <li class="flex items-center justify-between p-[1rem]"> <!-- Added flex and justify-between -->
                <a class="flex items-center gap-[1rem]" href="">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z"/></svg>
                    <div>Dark Mode</div>
                </a>
                <div class="border border-[#2b2e36] rounded-lg px-[8px] text-[14px] font-bold cursor-pointer">OFF</div>
            </li>

            <li class="flex items-center justify-between border-t border-[#2b2e36] p-[1rem]"> <!-- Added flex and justify-between -->
                <a class="flex items-center gap-[1rem]" href="">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-83 31.5-155.5t86-127Q252-817 325-848.5T480-880q83 0 155.5 31.5t127 86q54.5 54.5 86 127T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480-80Zm0-82q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z"/></svg>
                    <div>Language</div>
                </a>
                <div class="border border-[#2b2e36] rounded-lg px-[8px] text-[14px] font-bold cursor-pointer">OFF</div>
            </li>
        </ul>
    </div>

    <div class="pt-8">
        <ul class="flex flex-row gap-[1rem]">
            <li class="text-[.85em] font-bold"><a href="">Terms of Services</a></li>-
            <li class="text-[.85em] font-bold"><a href="">Contact</a></li>
        </ul>
    </div>
</aside>
